name: Build extensions

# Builds the Firefox (AMO) and Chrome (Chrome Web Store) packages on every push and pull request.
# Pushing a tag like v1.0.1 also publishes both packages to a GitHub release; the tag must match
# the version in extension/manifest.json.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The triplebit organisation only runs actions pinned to a full commit SHA.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The oldest Node the tests support, so a newer-only feature fails here first.
          node-version: 22

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build packages
        run: node scripts/build.mjs

      # Mozilla's add-on linter, which AMO also runs on upload. Warnings do not fail the build.
      - name: Lint Firefox package
        run: npx --yes web-ext@10 lint --source-dir dist/firefox

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: larvatus-packages
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: larvatus-packages
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Larvatus $GITHUB_REF_NAME" --generate-notes

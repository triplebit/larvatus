name: Build extensions

# Builds the Firefox (AMO) and Chrome (Chrome Web Store) packages on every push and pull request.
# Pushing a tag like v1.0.1 also publishes both packages to a GitHub release; the tag must match
# the version in extension/manifest.json.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The triplebit organisation only runs actions pinned to a full commit SHA.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build packages
        run: node scripts/build.mjs

      # Mozilla's add-on linter, which AMO also runs on upload. The latest 8.x is used so the linter
      # knows recent manifest keys such as data_collection_permissions; warnings do not fail the build.
      - name: Lint Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist/firefox

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: larvatus-packages
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: larvatus-packages
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Larvatus $GITHUB_REF_NAME" --generate-notes

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Larvatus</title><link rel="stylesheet" href="style.css"><script type="module" src="popup.js"></script></head>
<body class="popup">
<header><img src="icon.svg" width="30" height="30" alt=""><strong>Larvatus</strong><button id="account" class="quiet trailing">Settings ↗</button></header>
<main>
  <section id="welcome" hidden>
    <h1>Connect to Stalwart</h1>
    <p>Enter your mail server to sign in and manage your masked addresses.</p>
    <form id="connect-form" class="connect">
      <label for="server">Server address</label>
      <input id="server" placeholder="mail.example.com" required autocomplete="url" autocapitalize="none" spellcheck="false">
      <button id="connect" class="primary">Sign in with Stalwart <span aria-hidden="true">↗</span></button>
    </form>
  </section>
  <div id="workspace" hidden>
    <section id="spotlight" class="spotlight" hidden aria-live="polite"><p id="spotlight-title"></p><div id="spotlight-list"></div></section>
    <form id="composer" class="composer">
      <h1>New address</h1>
      <label for="prefix">Prefix <small>Optional</small></label>
      <input id="prefix" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_]{0,63}" title="Start with a letter or digit. Use letters, digits or underscores." placeholder="Random prefix" spellcheck="false" autocomplete="off">
      <label for="description">Description <small>Optional</small></label>
      <input id="description" placeholder="What’s this address for?" autocomplete="off">
      <button class="primary" id="create"><span aria-hidden="true">＋</span> Create address</button>
      <button type="button" class="text-link" id="enable-autofill" hidden>Enable an on-page autofill button in settings</button>
    </form>
    <section class="collection" aria-labelledby="list-title">
      <div class="section-head"><h2 id="list-title">Your addresses</h2><button id="reload" class="quiet trailing">Refresh</button></div>
      <div class="search-box"><input aria-label="Search addresses and descriptions" type="search" id="search" placeholder="Search addresses and descriptions"></div>
      <div class="meta"><span id="count"></span><span>Newest first ↓</span></div>
      <ul id="aliases" aria-label="Masked addresses"></ul><p id="empty" class="empty" hidden></p>
    </section>
  </div>
</main>
<p id="notice" role="status">Loading…</p>
<template id="row">
  <li><div class="row-head"><button class="copy" title="Copy address"></button><div class="row-actions">
    <button type="button" class="edit" title="Edit in Stalwart"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M11.1 2.3a1.6 1.6 0 0 1 2.3 0l.3.3a1.6 1.6 0 0 1 0 2.3l-8 8-3.2.9.9-3.2z M9.8 3.6l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
    <button type="button" class="delete" title="Delete address"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 4h11M6.2 4V2.6h3.6V4M4 4l.7 9.4h6.6L12 4M6.7 6.6v4.3M9.3 6.6v4.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
    <button type="button" role="switch" class="switch"><span></span></button></div></div>
  <div class="description"></div><div class="date"></div>
  <div class="confirm" role="group" hidden><p></p><div class="confirm-actions"><button type="button" class="primary">Delete</button><button type="button" class="cancel">Cancel</button></div></div></li>
</template>
</body></html>
